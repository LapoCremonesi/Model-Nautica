name: Deploy su GitHub Pages

on:
  push:
    branches:
      # Il branch principale: da qui esce il sito pubblico.
      - main
      # Branch di anteprima: si può togliere dopo il merge della PR.
      - claude/model-nautica-redesign-40atwy
  workflow_dispatch:

# Permessi richiesti dal deploy su Pages.
permissions:
  contents: read
  pages: write
  id-token: write

# Un deploy alla volta; le esecuzioni in coda vengono sostituite dall'ultima.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Installa le dipendenze
        run: npm ci

      - name: Build
        run: npm run build

      - name: Configura Pages
        uses: actions/configure-pages@v5
        with:
          # Abilita Pages sul repository se non lo è già.
          enablement: true

      - name: Carica l'artefatto
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Pubblica su Pages
        id: deployment
        uses: actions/deploy-pages@v4
